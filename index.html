<meta charset="UTF-8">

<title>for you ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffafd;
  font-family: Georgia, serif;
  overflow: hidden;
  color: #ff5caa;
}

#screen {
  height: 100vh;
  width: 100vw;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#heart {
  position: absolute;
  width: min(94vw, 650px);
  height: min(82vh, 650px);
  opacity: 0;
  transition: opacity 2s ease;
}

.word {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  font-size: clamp(9px, 1.7vw, 14px);
  color: #ff5eae;
  text-shadow: 0 0 5px #ffafd6, 0 0 12px #ff77bd;
  animation: appear 1s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

#intro {
  position: absolute;
  z-index: 5;
  text-align: center;
  width: 90%;
  animation: fade 2s ease;
}

h1 {
  font-size: clamp(28px, 7vw, 48px);
  font-weight: normal;
  color: #ff5caa;
  text-shadow: 0 0 15px #ffb3d7;
}

p {
  color: #b77b99;
  font-size: 15px;
}

button {
  margin-top: 20px;
  border: 1px solid #ff9acb;
  border-radius: 30px;
  padding: 12px 25px;
  background: #fff0f7;
  color: #f04e9d;
  font-family: Georgia, serif;
  font-size: 15px;
  cursor: pointer;
}

#final {
  display: none;
  position: absolute;
  z-index: 10;
  text-align: center;
  width: 90%;
  animation: fade 2s ease;
}

#final h2 {
  font-weight: normal;
  font-size: clamp(25px, 6vw, 42px);
  color: #ff5caa;
  text-shadow: 0 0 15px #ffafd6;
}

#final p {
  line-height: 1.8;
}

#again {
  margin-top: 12px;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.sparkle {
  position: absolute;
  color: #ff91c8;
  pointer-events: none;
  animation: float 5s linear forwards;
}

@keyframes float {
  from { transform: translateY(20px) scale(.5); opacity: 0; }
  20% { opacity: .8; }
  to { transform: translateY(-100vh) scale(1.2); opacity: 0; }
}
</style>
</head>

<body>
<div id="screen">
  <div id="intro">
    <h1>hey, cutie ♡</h1>
    <p>if the world gave me every language, i think i’d still spend my whole life trying to find the right words for you.</p>
    <button onclick="start()">click me :)</button>
  </div>

  <div id="heart"></div>

  <div id="final">
    <h2>ntr-o lume plină de oameni, cumva,<br>inima mea tot și-ar găsi drumul spre tine.</h2>
    <p>Cumva, toate aceste cuvinte înseamnă același lucru: tu.</p>
    <button id="again" onclick="location.reload()">click me again :)</button>

let started = false;

function start() {
  if (started) return;
  started = true;

  document.getElementById("intro").style.display = "none";
  const heart = document.getElementById("heart");
  heart.style.opacity = "1";

  // Plot the words around a heart curve.
  const width = heart.clientWidth;
  const height = heart.clientHeight;
  const scale = Math.min(width / 34, height / 31);
  const cx = width / 2;
  const cy = height / 2 + scale * 2;

  phrases.slice(0, 150).forEach((phrase, i) => {
    const t = (i / 150) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t) - Math.cos(4*t);

    const span = document.createElement("span");
    span.className = "word";
    span.textContent = phrase[1];
    span.style.left = (cx + x * scale) + "px";
    span.style.top = (cy - y * scale) + "px";
    span.style.animationDelay = (i * 0.025) + "s";
    heart.appendChild(span);
  });

  // Floating little sparkles.
  for (let i = 0; i < 24; i++) {
    setTimeout(() => {
      const sparkle = document.createElement("span");
      sparkle.className = "sparkle";
      sparkle.textContent = ["♡", "✦", "♥", "୨୧"][i % 4];
      sparkle.style.left = Math.random() * 100 + "vw";
      sparkle.style.top = (70 + Math.random() * 30) + "vh";
      sparkle.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.getElementById("screen").appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 7000);
    }, i * 350);
  }

  setTimeout(() => {
    heart.style.opacity = "0";
    setTimeout(() => {
      heart.style.display = "none";
      document.getElementById("final").style.display = "block";
    }, 2000);
  }, 10000);
}
